<!doctype html>
<html><head><meta charset="utf-8"><title>Components</title>
<link rel="stylesheet" href="../theatre-scout.css">
<style>body{margin:0;padding:24px;font-family:var(--ts-font-sans);background:#fcfcfc}.grp{margin-bottom:24px}.lbl{font-family:var(--ts-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#717171;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
</head><body>
<div class="grp"><div class="lbl">Buttons</div><div class="row">
<button class="ts-btn ts-btn--primary">Book at Donmar ↗</button>
<button class="ts-btn">Save</button>
<button class="ts-btn">Filter · 0</button>
</div></div>
<div class="grp"><div class="lbl">Chips · tabs</div><div class="row">
<span class="ts-chip ts-chip--active">All</span>
<span class="ts-chip">Today</span>
<span class="ts-chip">This week</span>
<span class="ts-chip">New</span>
<span class="ts-chip">Closing</span>
</div></div>
<div class="grp"><div class="lbl">Status tags</div><div class="row">
<span class="ts-chip" style="border-color:#0c0c0c">PLAY</span>
<span class="ts-chip" style="border-color:#0c0c0c">REVIVAL</span>
<span class="ts-chip" style="border-color:#0c0c0c">12+</span>
<span class="ts-chip" style="color:#1e6f3b;border-color:#e6e6e6">NOW BOOKING</span>
<span class="ts-chip" style="color:#b34a1c;border-color:#e6e6e6">CLOSING SOON</span>
</div></div>
</body></html>
