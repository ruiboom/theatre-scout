<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theatre Scout — UI Kit</title>
<link rel="stylesheet" href="../../theatre-scout.css">
<style>
  /* Layout for the web kit. Tokens come from theatre-scout.css. */
  .app { min-height: 100vh; background: var(--ts-paper); }

  /* Bar */
  .bar { display: flex; justify-content: space-between; align-items: center;
         padding: 18px 32px; border-bottom: 1px solid var(--ts-ink); position: sticky; top: 0; z-index: 5; background: var(--ts-paper); }
  .bar-l { display: flex; align-items: center; gap: 14px;
           font-family: var(--ts-font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .bar-tile { width: 22px; height: 22px; background: var(--ts-ink); color: var(--ts-paper);
              display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: -0.04em; }
  .bar-sep { color: var(--ts-mute); }
  .bar-r { display: flex; gap: 18px; font-family: var(--ts-font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ts-mute); }
  .bar-r strong { color: var(--ts-ink); font-weight: 500; }

  /* Page */
  .page { padding: 0 32px 80px; max-width: 1440px; margin: 0 auto; }

  /* Hero */
  .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px; padding: 64px 0 56px; border-bottom: 1px solid var(--ts-ink); }
  .hero-l { display: flex; flex-direction: column; gap: 24px; }
  .hero-h1 { font-size: clamp(56px, 7vw, 96px); font-weight: 700; line-height: 0.92; letter-spacing: -0.04em; margin: 0; }
  .hero-p { font-size: 16px; line-height: 1.5; color: var(--ts-ink-2); max-width: 50ch; margin: 0; }
  .hero-cta { display: flex; gap: 8px; margin-top: 8px; }
  .hero-r { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 24px; align-content: start; padding-top: 8px; }

  /* Big number */
  .bignum-k { font-family: var(--ts-font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ts-mute); }
  .bignum-n { font-size: 64px; font-weight: 700; line-height: 0.9; letter-spacing: -0.035em; margin-top: 6px; font-feature-settings: "tnum"; }
  .bignum-s { font-family: var(--ts-font-mono); font-size: 10px; color: var(--ts-mute); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Controls */
  .controls { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--ts-ink); position: sticky; top: 59px; background: var(--ts-paper); z-index: 4; gap: 16px; }
  .controls-r { display: flex; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Rails */
  .rail { padding: 40px 0 16px; border-bottom: 1px solid var(--ts-hair); }
  .rail-head { display: grid; grid-template-columns: 60px 1fr auto; gap: 16px; align-items: baseline; margin-bottom: 24px; }
  .rail-idx { font-family: var(--ts-font-mono); font-size: 11px; color: var(--ts-mute); letter-spacing: 0.04em; }
  .rail-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .rail-count { font-family: var(--ts-font-mono); font-size: 11px; color: var(--ts-mute); letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
  .rail-count:hover { color: var(--ts-ink); }
  .rail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding-bottom: 24px; }

  .card { cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .card .thumb { margin-bottom: 8px; }
  .card-meta { font-family: var(--ts-font-mono); font-size: 10px; color: var(--ts-mute); text-transform: uppercase; letter-spacing: 0.04em; }
  .card-title { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; }
  .card-sub { font-size: 13px; color: var(--ts-ink-2); }
  .card-dates { font-family: var(--ts-font-mono); font-size: 11px; color: var(--ts-mute); margin-top: 2px; }
  .card:hover .card-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  .thumb { background-image: repeating-linear-gradient(135deg, #ededed 0 8px, #f5f5f5 8px 16px); }

  /* List view */
  .list { padding: 32px 0; }
  .list-head { padding-bottom: 16px; border-bottom: 1px solid var(--ts-ink); margin-bottom: 0; }
  .row { display: grid; grid-template-columns: 50px 80px 1fr 200px 130px 32px; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--ts-hair); align-items: center; cursor: pointer; }
  .row:hover { background: var(--ts-paper-2); }
  .row .thumb { width: 80px; height: 56px; }
  .row-idx { font-family: var(--ts-font-mono); font-size: 11px; color: var(--ts-mute); letter-spacing: 0.04em; }
  .row-title { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
  .row-tag { font-family: var(--ts-font-mono); font-size: 10px; color: var(--ts-mute); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
  .row-venue { font-size: 13px; color: var(--ts-ink-2); }
  .row-dates { font-family: var(--ts-font-mono); font-size: 11px; color: var(--ts-mute); }
  .row-save { background: none; border: 0; font-size: 16px; color: var(--ts-mute); cursor: pointer; }
  .row-save:hover { color: var(--ts-ink); }

  /* Calendar */
  .cal { padding: 32px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--ts-ink); border-left: 1px solid var(--ts-hair); margin-top: 16px; }
  .cal-day { border-right: 1px solid var(--ts-hair); border-bottom: 1px solid var(--ts-hair); min-height: 110px; padding: 8px; }
  .cal-d { font-family: var(--ts-font-mono); font-size: 11px; color: var(--ts-mute); letter-spacing: 0.04em; }
  .cal-show { margin-top: 6px; padding: 6px; background: var(--ts-ink); color: var(--ts-paper); cursor: pointer; }
  .cal-show-t { font-size: 12px; font-weight: 500; line-height: 1.2; }
  .cal-show-v { font-family: var(--ts-font-mono); font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(252,252,252,0.7); margin-top: 2px; }

  /* Footer */
  .foot { display: flex; justify-content: space-between; padding: 48px 0 0; border-top: 1px solid var(--ts-ink); margin-top: 64px; }

  /* Show detail */
  .show .crumb { display: flex; align-items: center; gap: 12px; padding: 24px 0; border-bottom: 1px solid var(--ts-hair); }
  .crumb-back { background: none; border: 0; font-family: var(--ts-font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; padding: 0; color: var(--ts-ink); }
  .crumb-back:hover { text-decoration: underline; text-underline-offset: 3px; }

  .show-hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 64px; padding: 56px 0; border-bottom: 1px solid var(--ts-ink); }
  .show-l { display: flex; flex-direction: column; gap: 16px; }
  .show-title { font-size: clamp(64px, 8vw, 110px); font-weight: 700; letter-spacing: -0.04em; line-height: 0.92; margin: 8px 0 0; }
  .show-venue { font-size: 18px; color: var(--ts-ink-2); }
  .show-syn { font-size: 16px; line-height: 1.55; max-width: 50ch; margin: 8px 0 0; }
  .show-cta { display: flex; gap: 8px; margin-top: 16px; }
  .show-status { color: var(--ts-good); }
  .show-still { aspect-ratio: 4/5; background-image: repeating-linear-gradient(135deg, #ededed 0 12px, #f5f5f5 12px 24px); }

  .show-body { display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px; padding: 56px 0; border-bottom: 1px solid var(--ts-hair); }
  .spec { margin: 16px 0 0; padding: 0; border-top: 1px solid var(--ts-ink); }
  .spec-row { display: grid; grid-template-columns: 160px 1fr; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--ts-hair); margin: 0; }
  .spec dt { font-family: var(--ts-font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ts-mute); }
  .spec dd { margin: 0; font-size: 15px; }

  /* Filter overlay */
  .filter-veil { position: fixed; inset: 0; background: rgba(12,12,12,0.4); z-index: 20; display: flex; justify-content: flex-end; }
  .filter-panel { width: min(420px, 100%); background: var(--ts-paper); border-left: 1px solid var(--ts-ink); padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
  .filter-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--ts-ink); }
  .filter-x { background: none; border: 0; font-size: 24px; cursor: pointer; line-height: 1; padding: 0; }
  .filter-group { display: flex; flex-direction: column; gap: 10px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-foot { margin-top: auto; display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid var(--ts-ink); }
  .filter-foot button { flex: 1; justify-content: center; }

  /* Mobile */
  @media (max-width: 720px) {
    .page { padding: 0 16px 64px; }
    .bar { padding: 14px 16px; }
    .bar-r { display: none; }
    .hero { grid-template-columns: 1fr; gap: 32px; padding: 32px 0; }
    .hero-h1 { font-size: 48px; }
    .hero-r { grid-template-columns: 1fr 1fr; gap: 16px; }
    .controls { flex-direction: column; align-items: stretch; gap: 12px; top: 51px; }
    .rail-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
    .rail-head { grid-template-columns: 40px 1fr auto; }
    .rail-title { font-size: 22px; }
    .row { grid-template-columns: 32px 60px 1fr 24px; gap: 12px; }
    .row .row-venue, .row .row-dates { display: none; }
    .show-hero { grid-template-columns: 1fr; gap: 32px; padding: 32px 0; }
    .show-body { grid-template-columns: 1fr; gap: 32px; padding: 32px 0; }
    .cal-grid { grid-template-columns: repeat(3, 1fr); }
    .foot { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
