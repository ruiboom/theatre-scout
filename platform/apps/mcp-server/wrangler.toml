name = "platform-mcp-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The McpAgent class needs Durable Object storage for per-session state.
# `agents/mcp` looks for a binding named `MCP_OBJECT` by default — keep it as
# such unless you call `MyAgent.serve(path, { binding: 'OTHER' })`.
[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "ListingsMCP" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListingsMCP"]

# OAuth provider state: registered clients, grants, access/refresh tokens.
# Create the namespace once against your Cloudflare account, then paste the id:
#
#   cd platform/apps/mcp-server
#   pnpm dlx wrangler kv namespace create OAUTH_KV
#
# wrangler prints an `id = "..."` line — copy it below. (Optionally also create
# a `--preview` namespace and add `preview_id` for `wrangler dev`.)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_OAUTH_KV_NAMESPACE_ID"

[vars]
# Default URL the worker calls. Override with `wrangler secret put API_BASE_URL`
# (recommended) or `[env.<name>].vars`. Pointed at the live Vercel deployment
# so a fresh deploy is functional even before secrets are set.
API_BASE_URL = "https://theatre-scout-zunz.vercel.app/api/v1"

[observability]
enabled = true
