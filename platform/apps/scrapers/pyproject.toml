[project]
name = "scrapers"
version = "0.0.0"
description = "Ingestion adapters: scrape 70 London theatres into the listings DB."
requires-python = ">=3.11"
# Stack matches scout/'s Tier 3 architecture:
#   - scrapling.fetchers handle HTTP (FetcherSession curl_cffi + StealthySession Patchright)
#   - scrapling.parser.Selector replaces bs4/lxml for HTML walking
#   - dateutil for messy listing-page dates
# Postgres replaces scout/'s SQLite, so psycopg is in.
dependencies = [
    # `[fetchers]` extra pulls in curl_cffi (fast path) + Patchright (stealth)
    "scrapling[fetchers]>=0.4.7",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "typer>=0.13",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
scrape = "scrapers.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapers"]
