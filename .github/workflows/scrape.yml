name: Daily scrape

# Daily refresh of the platform DB:
#   1. Sync venues from theatres.yaml (idempotent — schema changes only).
#   2. Run platform's own scrapers across all 80 adapters, writing direct to
#      Neon. 3-phase pipeline (serial listings → parallel enrich → writes).
#   3. Smoke-test the live API to confirm the count is sensible.
#
# This workflow used to bridge through scout's SQLite via the ETL script;
# that's gone now — every adapter has been ported into platform/apps/scrapers
# and registers itself on `load_all()`.
#
# Trigger manually from the Actions tab via "Run workflow" the first time so
# you can watch the log; the cron takes over after that.

on:
  schedule:
    # 05:00 UTC daily. Cron doesn't shift for DST so this lands at 05:00 GMT
    # in winter / 06:00 BST in summer — fresh just before commute-time
    # scrolling either way. Run takes ~17 min so data is current by 05:20.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the venue-health step opens/closes a rolling issue

# Don't let two scrape runs overlap; let an in-flight one finish.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape → Neon
    runs-on: ubuntu-latest
    # 45 was tight once real JS venues (Wix/LineupNow stealth renders) landed
    # and a run was cancelled mid-write. 75 gives headroom; the bigger lever
    # is keeping enrich off the stealth path (see adapters/barons_court.py).
    timeout-minutes: 75

    defaults:
      run:
        working-directory: platform/apps/scrapers

    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: platform/apps/scrapers/uv.lock

      # Patchright (Chromium) is needed for the ~8 JS-rendered venues. Cache
      # across runs so we only pay the ~250 MB download once a week-ish.
      - name: Cache Playwright/Patchright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Install scrapers deps
        run: uv sync

      - name: Install scrapling browser
        run: uv run scrapling install

      - name: Apply DB migrations
        # packages/db/migrations used to be "apply by hand", and 0005 sat
        # unapplied for weeks (nobody has a psql-able prod credential locally —
        # by design). This step applies anything new on every run, tracked in a
        # `schema_migrations` ledger. 0001–0004 predate the ledger and are
        # seeded as already applied.
        working-directory: platform/packages/db
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            CREATE TABLE IF NOT EXISTS schema_migrations (
              filename   TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
            );
            INSERT INTO schema_migrations (filename)
            VALUES ('0001_init.sql'), ('0002_align_with_scout.sql'),
                   ('0003_events.sql'), ('0004_venue_health_view.sql')
            ON CONFLICT DO NOTHING;"
          for f in migrations/*.sql; do
            name=$(basename "$f")
            applied=$(psql "$DATABASE_URL" -tAc \
              "SELECT 1 FROM schema_migrations WHERE filename = '$name'")
            if [ "$applied" = "1" ]; then
              echo "skip  $name (already applied)"
              continue
            fi
            echo "apply $name"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c \
              "INSERT INTO schema_migrations (filename) VALUES ('$name')"
          done

      - name: Sync venues from theatres.yaml
        # Idempotent. Picks up venue metadata changes (postcode, neighbourhood,
        # category, website) without touching shows.
        run: uv run scrape sync-venues ../../../theatres.yaml

      - name: Scrape all venues into Neon
        # `--enrich` fetches each show's detail page; `--replace` wipes prior
        # rows per venue on success; `--workers 16` fans enrichment across
        # hosts. Failed adapters are recorded as `failed` scrape_runs and the
        # job continues — a few broken venues won't sink the whole run.
        run: uv run scrape all --enrich --replace --workers 16

      - name: Prune old analytics events
        # The `events` table grows one row per tracked visit and is never
        # otherwise trimmed. Retention rides this daily cron (the one job that
        # already holds a direct Neon connection). `always()` so it runs even if
        # some venues failed above — it's independent of the scrape outcome.
        if: ${{ always() }}
        run: uv run scrape prune-events --days 90

      - name: Smoke-test live API
        if: ${{ vars.SITE_BASE_URL != '' }}
        working-directory: ${{ github.workspace }}
        run: |
          total=$(curl -fsS "${{ vars.SITE_BASE_URL }}/api/v1/shows?limit=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['total'])")
          echo "Live API reports $total upcoming shows"
          [ "$total" -gt 100 ] || {
            echo "::error::Suspiciously low total ($total) — investigate"
            exit 1
          }

      # ---- Venue health (advisory) -------------------------------------------
      # Catches the per-venue rot the global smoke test misses: a venue that
      # quietly returns 0 shows after a site redesign still records success.
      # `scrape health` reads the venue_health view; the next step maintains ONE
      # rolling issue that opens on the first anomaly and closes itself when
      # every venue recovers. Requires migration 0004 applied to Neon.

      - name: Check venue health
        if: ${{ always() }}
        # Advisory — never fail the job. `scrape health` exits 1 when venues are
        # flagged; capture the JSON for the issue step and swallow the exit code.
        run: uv run scrape health --json > "$RUNNER_TEMP/health.json" || true

      - name: Sync scraper-health issue
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let flagged = [];
            try {
              flagged = JSON.parse(
                fs.readFileSync(`${process.env.RUNNER_TEMP}/health.json`, 'utf8'),
              );
            } catch {
              core.info('No health.json — treating as healthy (scrape health produced no output).');
            }
            const LABEL = 'scraper-health';
            const TITLE = '🩺 Scraper health: venues need attention';
            const { owner, repo } = context.repo;

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 1,
            });
            const existing = open[0];

            if (!flagged.length) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: '✅ All venues healthy again — closing.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              core.info('No venues flagged.');
              return;
            }

            const table = flagged
              .map((v) => `| \`${v.venue_slug}\` | ${v.reason} | ${v.latest_found} | ~${Math.round(v.median_found)} | ${v.latest_status} |`)
              .join('\n');
            const body = [
              `\`scrape health\` flagged **${flagged.length}** venue(s) on the latest run.`,
              '',
              '| venue | reason | latest | ~median | status |',
              '| --- | --- | --- | --- | --- |',
              table,
              '',
              '_**failed** = adapter raised · **silent-zero** = 0 shows but it used to return some (likely a site redesign) · **collapse** = sharp drop vs median · **stale** = no run in 30h._',
              '',
              'Auto-managed by the Daily scrape workflow — edited each run, closed when every venue recovers.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title: TITLE, body,
              });
            } else {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'd73a4a' });
              } catch (e) {
                core.info(`Label create skipped: ${e.message}`);
              }
              await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: [LABEL] });
            }
