<!doctype html>
<html><head><meta charset="utf-8"><title>Colour</title>
<link rel="stylesheet" href="../theatre-scout.css">
<style>body{margin:0;padding:20px;font-family:var(--ts-font-sans)}.row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.sw{display:flex;flex-direction:column}.chip{height:64px;border:1px solid var(--ts-hair)}.k{font-family:var(--ts-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts-mute);margin-top:6px}.v{font-family:var(--ts-font-mono);font-size:11px;color:var(--ts-ink);margin-top:2px}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:#fcfcfc"></div><div class="k">Paper</div><div class="v">#FCFCFC</div></div>
<div class="sw"><div class="chip" style="background:#f5f5f5"></div><div class="k">Paper-2</div><div class="v">#F5F5F5</div></div>
<div class="sw"><div class="chip" style="background:#e6e6e6"></div><div class="k">Hair</div><div class="v">#E6E6E6</div></div>
<div class="sw"><div class="chip" style="background:#717171"></div><div class="k">Mute</div><div class="v">#717171</div></div>
<div class="sw"><div class="chip" style="background:#2a2a2a"></div><div class="k">Ink-2</div><div class="v">#2A2A2A</div></div>
<div class="sw"><div class="chip" style="background:#0c0c0c"></div><div class="k">Ink</div><div class="v">#0C0C0C</div></div>
<div class="sw"><div class="chip" style="background:#fcfcfc;border-left:8px solid #b34a1c"></div><div class="k">Warn (text)</div><div class="v">#B34A1C</div></div>
</div></body></html>
