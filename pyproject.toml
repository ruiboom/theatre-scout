[project]
name = "theatre-scout"
version = "0.1.0"
description = "Local app that scrapes London theatre websites and builds a searchable directory of shows."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "scrapling[fetchers]>=0.4.7",
]

[project.scripts]
scout = "scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    # Used only by fastapi.testclient.TestClient — not in production runtime.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # lxml emits this from inside Scrapling's Selector — out of our control.
    "ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scout/web/app.py" = ["B008"]  # FastAPI Depends() in defaults is the framework's idiom

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scout"]
